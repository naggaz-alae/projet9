name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, intl
          ini-values: error_reporting=E_ALL, display_errors=On
          coverage: none

      - name: Vérification de la syntaxe de tous les fichiers PHP
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Tests unitaires
        run: php tests/run.php

      - name: Test de bout en bout (vrai serveur, vraies requêtes HTTP)
        run: bash tests/fumee.sh
